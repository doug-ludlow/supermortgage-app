<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supermortgage demo phone</title>
<style>
  /* The 9:16 pass: the prototype's 390×844 screen at 2×, nothing else. */
  html, body { margin: 0; width: 780px; height: 1688px; overflow: hidden; background: #fcfcfc; }
  iframe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; transform: scale(2); transform-origin: 0 0; background: #fcfcfc; }
</style>
</head>
<body>
<iframe id="phone" name="phone" src="about:blank"></iframe>
<script>
  window.stage = { load(src) { document.getElementById('phone').src = src; }, caption() {}, chapters() {}, chapter() {}, dark() {} };
</script>
</body>
</html>
