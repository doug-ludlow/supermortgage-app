name: iOS

on:
  push:
    branches-ignore:
      - screenshots
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (XcodeGen project)
    # macos-15: Firebase 12.19.2 needs Swift 6.1 tools (Xcode 16.3+); macos-14 tops out at Xcode 16.2.
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          # The newest Xcode 16 (16.4 on macos-15, iOS 18 SDK); failing that, the newest Xcode there is.
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Pick the iPhone 15 simulator
        run: |
          # macos-15 images ship no iPhone 15, so one is created on the newest iOS runtime whose major
          # version matches the selected Xcode's iOS SDK (18 for Xcode 16.4), else on the newest runtime.
          SDK_MAJOR=$(xcodebuild -showsdks -json 2>/dev/null | python3 -c '
          import json, re, sys
          majors = []
          try:
              for sdk in json.load(sys.stdin):
                  m = re.match(r"iphonesimulator(\d+)", sdk.get("canonicalName", ""))
                  if not m and sdk.get("platform") == "iphonesimulator":
                      m = re.match(r"(\d+)", sdk.get("sdkVersion") or sdk.get("platformVersion") or "")
                  if m:
                      majors.append(int(m.group(1)))
          except Exception:
              pass
          print(max(majors) if majors else "")
          ' || true)
          echo "iOS SDK major: ${SDK_MAJOR:-unknown}"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.rsplit("-", 2)[-2:]) if "iOS-" in runtime else (0, 0)
              for d in devices:
                  if d.get("name") == "iPhone 15" and d.get("isAvailable", False):
                      if best is None or version > best[0]:
                          best = (version, d["udid"])
          print(best[1] if best else "")
          ')
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          major = sys.argv[1]
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable", False)]
          runtimes.sort(key=lambda r: tuple(int(x) for x in r["version"].split(".")))
          matching = [r for r in runtimes if major and r["version"].split(".")[0] == major]
          chosen = matching or runtimes
          print(chosen[-1]["identifier"] if chosen else "")
          ' "$SDK_MAJOR")
            echo "Creating an iPhone 15 on $RUNTIME"
            UDID=$(xcrun simctl create "iPhone 15" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$RUNTIME")
          fi
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Cache the Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      # Simulator builds are not signed: the Sign in with Apple entitlement would otherwise demand a team.
      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project ios/Supermortgage.xcodeproj -scheme Supermortgage \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/unit.xcresult \
            -only-testing:SupermortgageTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee build/unit-tests.log
      - name: What failed (unit tests)
        if: failure()
        run: |
          # The compiler errors and failing test cases, kept in a file the job prints last.
          {
          grep -E "error:|Test Case .* failed|failed \(|\*\* TEST FAILED|Testing failed:|Fatal error|Restarting after" build/unit-tests.log | grep -v "^warning" | head -n 80 || true
          if [ -d build/unit.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/unit.xcresult 2>/dev/null | head -n 120 || true
            xcrun xcresulttool get test-results tests --path build/unit.xcresult 2>/dev/null | python3 -c '
          import json, sys
          try:
              doc = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          def walk(node, path):
              name = node.get("name", "")
              kids = node.get("children", [])
              if not kids and node.get("result") not in (None, "Passed", "Skipped"):
                  print("FAILED:", "/".join(path + [name]), node.get("result"))
                  for line in node.get("failureMessages", []) or []:
                      print("   ", line[:400])
              for k in kids:
                  walk(k, path + [name])
          for n in doc.get("testNodes", []):
              walk(n, [])
          ' || true
          fi
          } > build/unit-failure.txt 2>&1
          cat build/unit-failure.txt
      # The walk signs in against a local API (docs/SIGNUP-FOR-REAL.md §6): Postgres 16, the Firebase
      # Auth emulator and the API itself, all on 127.0.0.1, which the simulator shares with the host.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Start Postgres 16
        run: |
          brew install postgresql@16
          PG="$(brew --prefix postgresql@16)/bin"
          mkdir -p build/postgres
          "$PG/initdb" -D build/postgres/data -U postgres --auth=trust --encoding=UTF8 --locale=C > build/postgres/initdb.log 2>&1 \
            || { cat build/postgres/initdb.log; exit 1; }
          "$PG/pg_ctl" -D build/postgres/data -l build/postgres/postgres.log -o "-p 5432 -c listen_addresses=127.0.0.1" -w start
          "$PG/psql" -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE app WITH LOGIN PASSWORD 'app';" \
            -c "CREATE DATABASE app OWNER app;"
      - name: Install the API
        working-directory: api
        run: npm ci --no-audit --no-fund
      - name: Start the Firebase Auth emulator
        working-directory: api
        run: |
          mkdir -p ../build
          (npx --yes firebase-tools@15 emulators:start --only auth --project demo-supermortgage > ../build/emulator.log 2>&1 &)
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:9099/ > /dev/null; then echo "emulator up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::the Auth emulator did not start"; tail -n 50 ../build/emulator.log; exit 1
      - name: Build and start the API
        working-directory: api
        env:
          PORT: "8080"
          DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app
          GOOGLE_CLOUD_PROJECT: demo-supermortgage
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          ENVIRONMENT: test
          MAIL_STUB: "1"
          EMAIL_CODE_PEPPER: ci-only-pepper-0123456789abcdef
        run: |
          npm run build
          (node dist/main.js > ../build/api.log 2>&1 &)
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)" = "200" ]; then echo "API up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::the API did not answer on /health"; tail -n 50 ../build/api.log; exit 1
      - name: The walk
        run: |
          set -o pipefail
          xcodebuild -project ios/Supermortgage.xcodeproj -scheme Supermortgage \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/walk.xcresult \
            -only-testing:SupermortgageUITests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee build/walk.log
      - name: What failed (the walk)
        if: failure()
        run: |
          {
          grep -E "error:|Test Case .* failed|failed \(|\*\* TEST FAILED|Testing failed:|Fatal error|missing " build/walk.log | head -n 60 || true
          # The accessibility hierarchy the walk prints when an element is missing.
          awk "/=== accessibility hierarchy/,/=== end hierarchy ===/" build/walk.log | head -n 400 || true
          echo "===== api.log (last 60 lines) ====="
          tail -n 60 build/api.log 2>/dev/null || true
          } > build/walk-failure.txt 2>&1
          cat build/walk-failure.txt
      - name: The API's and the emulator's logs
        if: always()
        run: |
          for f in build/api.log build/emulator.log build/postgres/postgres.log; do
            [ -f "$f" ] || continue
            echo "===== $f (last 200 lines) ====="
            tail -n 200 "$f"
          done
      - name: Export the walk's screenshots
        if: always()
        run: |
          if [ -d build/walk.xcresult ]; then
            xcrun xcresulttool export attachments --path build/walk.xcresult --output-path build/walk-screenshots || true
            for f in build/walk-screenshots/*.txt; do
              [ -f "$f" ] || continue
              echo "===== $f ====="
              head -c 60000 "$f"
              echo
            done
            # Name the screenshots as the walk named them (01-welcome.png …) using the export manifest.
            python3 - <<'PY'
          import json, os, re, shutil
          root = "build/walk-screenshots"
          manifest = os.path.join(root, "manifest.json")
          if not os.path.exists(manifest):
              raise SystemExit(0)
          out = os.path.join(root, "named")
          os.makedirs(out, exist_ok=True)
          for test in json.load(open(manifest)):
              for a in test.get("attachments", []):
                  src = os.path.join(root, a.get("exportedFileName", ""))
                  name = a.get("suggestedHumanReadableName", "")
                  m = re.match(r"^(\d\d-[a-z0-9-]+)_\d+_[0-9A-F-]+\.png$", name)
                  if m and os.path.exists(src):
                      shutil.copyfile(src, os.path.join(out, m.group(1) + ".png"))
          print("named screenshots:", sorted(os.listdir(out)))
          PY
          fi
      - name: Upload the walk's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walk-screenshots
          path: build/walk-screenshots
          if-no-files-found: ignore
      - name: Publish the screenshots to the screenshots branch
        if: always() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SRC=build/walk-screenshots/named
          if [ ! -d "$SRC" ] || [ -z "$(ls -A "$SRC")" ]; then
            if [ ! -f build/walk-failure.txt ]; then echo "No named screenshots"; exit 0; fi
            mkdir -p "$SRC"
          fi
          rm -rf build/screenshots-branch && mkdir -p build/screenshots-branch && cd build/screenshots-branch
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ../walk-screenshots/named/*.png .
          for f in ../walk-failure.txt ../unit-failure.txt; do [ -f "$f" ] && cp "$f" .; done
          {
            echo "# Walk screenshots"
            echo
            echo "Taken by the walk (\`SupermortgageUITests\`) on the iPhone 15 simulator, commit \`${GITHUB_SHA::7}\`. The last four are in dark mode."
            echo
            for f in $(ls *.png | sort); do echo "## ${f%.png}"; echo; echo "![${f%.png}](./$f)"; echo; done
          } > README.md
          git add -A
          git commit -q -m "Walk screenshots for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
          echo "Browse them at https://github.com/${GITHUB_REPOSITORY}/tree/screenshots"
      - name: Build a universal simulator app (arm64 + x86_64, for Appetize.io)
        if: always()
        run: |
          set -o pipefail
          xcodebuild -project ios/Supermortgage.xcodeproj -scheme Supermortgage \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build/UniversalDerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
          APP=$(find build/UniversalDerivedData/Build/Products -maxdepth 2 -name 'Supermortgage.app' -type d | head -1)
          ditto -c -k --keepParent "$APP" build/Supermortgage-simulator.app.zip
          lipo -info "$APP/Supermortgage"
      - name: Upload the simulator build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Supermortgage-simulator-app
          path: build/Supermortgage-simulator.app.zip
          if-no-files-found: ignore
      - name: Publish to Appetize.io
        if: always()
        env:
          # Either name works for the token; secret names are case-insensitive on GitHub.
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN || secrets.APPETIZE }}
          APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          if [ ! -f build/Supermortgage-simulator.app.zip ]; then
            echo "No simulator build to publish"; exit 0
          fi
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "No APPETIZE_API_TOKEN secret set — skipping the Appetize.io upload."
            echo "Add it under Settings → Secrets and variables → Actions to publish every push."
            exit 0
          fi
          URL="https://api.appetize.io/v1/apps"
          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then URL="$URL/$APPETIZE_PUBLIC_KEY"; fi
          RESPONSE=$(curl -sS --fail-with-body -X POST "$URL" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@build/Supermortgage-simulator.app.zip" \
            -F "platform=ios" \
            -F "note=supermortgage-app ${GITHUB_SHA::7}") || { echo "Appetize upload failed: $RESPONSE"; exit 1; }
          echo "$RESPONSE" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          key = r.get("publicKey", "")
          print("Appetize public key:", key)
          print("Open the app at:", r.get("publicURL") or r.get("appURL") or ("https://appetize.io/app/" + key))
          print("Manage it at:", r.get("manageURL", ""))
          '
          echo "::notice title=Appetize.io::$(echo "$RESPONSE" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r.get("publicURL") or r.get("appURL") or ("https://appetize.io/app/"+r.get("publicKey","")))')"
      - name: Failure summary (repeated last, so it is in the log's tail)
        if: failure()
        run: |
          for f in build/unit-failure.txt build/walk-failure.txt; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done

  build-committed-project:
    name: Build (committed .xcodeproj, no tooling)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Pick the iPhone 15 simulator
        run: |
          SDK_MAJOR=$(xcodebuild -showsdks -json 2>/dev/null | python3 -c '
          import json, re, sys
          majors = []
          try:
              for sdk in json.load(sys.stdin):
                  m = re.match(r"iphonesimulator(\d+)", sdk.get("canonicalName", ""))
                  if not m and sdk.get("platform") == "iphonesimulator":
                      m = re.match(r"(\d+)", sdk.get("sdkVersion") or sdk.get("platformVersion") or "")
                  if m:
                      majors.append(int(m.group(1)))
          except Exception:
              pass
          print(max(majors) if majors else "")
          ' || true)
          echo "iOS SDK major: ${SDK_MAJOR:-unknown}"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(x) for x in runtime.rsplit("-", 2)[-2:]) if "iOS-" in runtime else (0, 0)
              for d in devices:
                  if d.get("name") == "iPhone 15" and d.get("isAvailable", False):
                      if best is None or version > best[0]:
                          best = (version, d["udid"])
          print(best[1] if best else "")
          ')
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          major = sys.argv[1]
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r.get("platform") == "iOS" and r.get("isAvailable", False)]
          runtimes.sort(key=lambda r: tuple(int(x) for x in r["version"].split(".")))
          matching = [r for r in runtimes if major and r["version"].split(".")[0] == major]
          chosen = matching or runtimes
          print(chosen[-1]["identifier"] if chosen else "")
          ' "$SDK_MAJOR")
            echo "Creating an iPhone 15 on $RUNTIME"
            UDID=$(xcrun simctl create "iPhone 15" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$RUNTIME")
          fi
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Cache the Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Build the app and both test bundles from the committed project
        run: |
          set -o pipefail
          xcodebuild -project ios/Supermortgage.xcodeproj -scheme Supermortgage \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build-for-testing

  testflight:
    # Needs the repository variable APPLE_TEAM_ID (the Apple Developer Team ID, public) and the secrets
    # ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (the App Store Connect API key's .p8, base64-encoded:
    # `base64 -i AuthKey_<KEY_ID>.p8`). docs/SIGNUP-FOR-REAL.md §7 and §8.
    name: TestFlight
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && vars.APPLE_TEAM_ID != ''
    runs-on: macos-15
    timeout-minutes: 60
    environment: testflight
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Cache the Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: ${{ runner.os }}-spm-
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$KEY"
          # altool looks for AuthKey_<KEY_ID>.p8 in ~/private_keys.
          mkdir -p ~/private_keys
          cp "$KEY" ~/private_keys/
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project ios/Supermortgage.xcodeproj -scheme Supermortgage \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Supermortgage.xcarchive \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ vars.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: Export the .ipa
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>destination</key>
          	<string>export</string>
          	<key>method</key>
          	<string>app-store-connect</string>
          	<key>signingStyle</key>
          	<string>automatic</string>
          	<key>teamID</key>
          	<string>${{ vars.APPLE_TEAM_ID }}</string>
          	<key>uploadSymbols</key>
          	<true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Supermortgage.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          ls -la build/export
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -f build/export/Supermortgage.ipa -t ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"
      - name: Upload the .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Supermortgage-ipa
          path: build/export/Supermortgage.ipa
          if-no-files-found: ignore
