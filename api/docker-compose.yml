# Local dependencies for the API: Postgres 16 and the Firebase Auth emulator.
#   docker compose up
#   cp .env.example .env && npm run dev
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
  auth:
    image: node:22
    working_dir: /emulator
    command: npx --yes firebase-tools@15 emulators:start --only auth --project demo-supermortgage
    environment:
      FIREBASE_EMULATOR_HUB: ""
    ports:
      - "9099:9099"
    volumes:
      - ./firebase.json:/emulator/firebase.json:ro
volumes:
  db:
