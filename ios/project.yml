name: Supermortgage
options:
  bundleIdPrefix: com.supermortgage
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
# The only two dependencies (docs/SIGNUP-FOR-REAL.md §2), pinned exactly. ios/tools/gen-pbxproj.py
# carries the same pins for the committed project; change both together.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "12.19.2"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: "10.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
  configs:
    Debug:
      ENABLE_TESTABILITY: "YES"
targets:
  Supermortgage:
    type: application
    platform: iOS
    sources:
      - path: Supermortgage
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    # XcodeGen writes Supermortgage/Info.plist from these and sets INFOPLIST_FILE; the committed file
    # must match it key for key (the version keys override XcodeGen's literal "1.0" and "1" defaults).
    info:
      path: Supermortgage/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Supermortgage
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Google Sign-In's callback URL scheme (the REVERSED_CLIENT_ID of GoogleService-Info.plist).
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.supermortgage.app.google
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
        # Debug builds talk to the API and the Auth emulator on 127.0.0.1.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The app reads these two (APIClient's base URL, AuthSession's emulator).
        SMAPIBaseURL: $(API_BASE_URL)
        SMAuthEmulatorHost: $(AUTH_EMULATOR_HOST)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Supermortgage/Supermortgage.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supermortgage.app
        PRODUCT_NAME: Supermortgage
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Supermortgage/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Supermortgage/Supermortgage.entitlements
        # Doug's Apple Developer Team ID (public; docs/SIGNUP-FOR-REAL.md §8). CI's TestFlight job
        # passes its own from the APPLE_TEAM_ID repository variable.
        DEVELOPMENT_TEAM: ""
        # Replace with REVERSED_CLIENT_ID from GoogleService-Info.plist once it exists.
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.REPLACE-ME
        SWIFT_EMIT_LOC_STRINGS: "YES"
      configs:
        Debug:
          API_BASE_URL: http://127.0.0.1:8080
          AUTH_EMULATOR_HOST: 127.0.0.1:9099
        Release:
          API_BASE_URL: https://api-nonprod.supermortgage.com
          AUTH_EMULATOR_HOST: ""
    scheme:
      testTargets:
        - SupermortgageTests
        - SupermortgageUITests
      gatherCoverageData: false
  SupermortgageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SupermortgageTests
    dependencies:
      - target: Supermortgage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supermortgage.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
  SupermortgageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SupermortgageUITests
    dependencies:
      - target: Supermortgage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supermortgage.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
